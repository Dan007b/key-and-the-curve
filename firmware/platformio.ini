; Phase Escape: controller firmware.
; ESP32-DevKitC V4 (ESP32-WROOM-32D) + BNO055, streaming over Bluetooth Low
; Energy and the board's USB-to-UART bridge.

[env:esp32dev]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino

; Adafruit BusIO includes <SPI.h>; the default finder misses framework
; libraries pulled in by dependencies, so scan them deeply.
lib_ldf_mode = deep+

; Silence the ESP32 core's own log lines (e.g. "[E][Wire.cpp] ..."): they don't
; start with '#', so they would break the protocol's "debug lines start with #" rule.
build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit BNO055 @ 1.6.4
    adafruit/Adafruit Unified Sensor @ 1.1.15
    ; Bluetooth Low Energy: NimBLE is much smaller than the ESP32's default Bluedroid stack.
    ; 1.4.x is the line made for the Arduino-ESP32 2.x core this platform version uses.
    h2zero/NimBLE-Arduino @ 1.4.3

; The classic ESP32 has no native USB, so Serial goes through the UART bridge
; and the baud rate is real. A 100 Hz stream of ~85-char lines is ~8.5 kB/s,
; which would use ~75% of 115200 baud; 921600 leaves plenty of headroom.
; The game must open the Web Serial port at this same rate.
monitor_speed = 921600
upload_speed = 921600
