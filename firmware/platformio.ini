; The Key and the Curve: controller firmware.
; ESP32-S3 + BNO055, streaming orientation over native USB CDC.
;
; TODO(Danny): confirm the exact board variant. esp32-s3-devkitc-1 is the
; default from the spec; flash/PSRAM size differs between DevKitC variants.

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; Native USB CDC, so Serial is the USB port (no UART bridge needed).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Adafruit BusIO includes <SPI.h>; the default finder misses framework
; libraries pulled in by dependencies, so scan them deeply.
lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit BNO055 @ 1.6.4
    adafruit/Adafruit Unified Sensor @ 1.1.15

; Baud rate is ignored by USB CDC but keeps the monitor happy.
monitor_speed = 115200
